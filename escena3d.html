<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta 3D — Frenado en pendiente</title>
<style>
  :root{
    --navy:#0b2545; --navy2:#13315c; --azul:#1f6fd1; --celeste:#8db3e2; --gris:#5f6b7a;
    --borde:#d6dfeb; --fondo:#eef3f9; --blanco:#ffffff;
    --verde:#2e9d5b; --naranja:#ef7d1a; --rojo:#d63a3a; --morado:#8e44ad;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--fondo);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--navy);overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;width:100vw}
  #vista{position:relative;flex:1 1 auto;min-height:260px;overflow:hidden;border-radius:10px 10px 0 0;background:linear-gradient(#dfe8f3,#f6f8fb)}
  #lienzo{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #lienzo:active{cursor:grabbing}
  #etiquetas{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;font-weight:600;
       padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.88);border:1px solid var(--borde);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .lbl.zona{font-size:10.5px;letter-spacing:.03em;background:rgba(19,49,92,.85);color:#fff;border-color:rgba(19,49,92,.85)}
  .lbl.f{background:rgba(255,255,255,.93);font-size:11px}
  .lbl.oscuro{background:rgba(11,37,69,.9);color:#fff;border-color:rgba(11,37,69,.9)}
  .hud{position:absolute;background:rgba(11,37,69,.88);color:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 4px 16px rgba(11,37,69,.25);backdrop-filter:blur(3px)}
  #hudDatos{top:10px;left:10px;min-width:220px}
  #estado{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:#5f6b7a;margin-bottom:8px;text-transform:uppercase}
  .fila{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;line-height:1.55}
  .fila span:first-child{color:#b9cde6}
  .fila span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
  .sep{height:1px;background:rgba(255,255,255,.15);margin:5px 0}
  #hudCam{top:10px;right:10px;display:flex;flex-direction:column;gap:6px;padding:8px}
  #hudCam .grupo{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  #hudCam .tit{font-size:10px;color:#b9cde6;text-transform:uppercase;letter-spacing:.08em;text-align:right}
  button{font-family:inherit;font-size:12px;font-weight:600;border:1px solid transparent;border-radius:7px;padding:6px 10px;cursor:pointer;
         background:#fff;color:var(--navy);transition:background .15s,border-color .15s}
  button:hover{border-color:var(--azul)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .hud button{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.18)}
  .hud button:hover{background:rgba(255,255,255,.2)}
  .hud button.on{background:var(--azul);border-color:var(--azul)}
  #leyenda{bottom:10px;right:10px;font-size:11.5px;padding:8px 10px;display:none}
  #leyenda .it{display:flex;align-items:center;gap:7px;line-height:1.6}
  #leyenda .sw{width:22px;height:4px;border-radius:2px}
  #leyenda .sw.dash{background-image:linear-gradient(90deg,currentColor 55%,transparent 45%)!important;background-size:7px 4px;background-color:transparent!important}
  #aviso{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:70%;background:rgba(214,58,58,.95);color:#fff;font-size:12px;
         padding:7px 12px;border-radius:8px;display:none;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  #barra{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:var(--navy);color:#fff}
  #barra button{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
  #barra button:hover{background:rgba(255,255,255,.18)}
  #barra button.prim{background:var(--azul);border-color:var(--azul)}
  #tiempo{flex:1 1 220px;min-width:160px;accent-color:#8db3e2}
  #tlbl{font-variant-numeric:tabular-nums;font-size:12px;min-width:120px;text-align:right}
  #vel{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 6px;font-family:inherit;font-size:12px}
  #vel option{color:#0b2545}
  #graficas{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;background:#fff;border-radius:0 0 10px 10px;border-top:1px solid var(--borde)}
  .gwrap{position:relative;border:1px solid var(--borde);border-radius:8px;background:#fbfcfe;height:150px}
  .gwrap canvas{width:100%;height:100%;display:block;cursor:crosshair}
  #carga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gris)}
  @media (max-width:760px){
    #graficas{grid-template-columns:1fr}
    .gwrap{height:120px}
    #hudDatos{min-width:170px;padding:7px 9px}
    .fila{font-size:11px}
    #hudCam{max-width:46%}
  }
</style>
</head>
<body>
<div id="app">
  <div id="vista">
    <div id="carga">Cargando maqueta 3D…</div>
    <canvas id="lienzo"></canvas>
    <div id="etiquetas"></div>
    <div class="hud" id="hudDatos">
      <div id="estado">Preparado</div>
      <div class="fila"><span>Tiempo t</span><span id="vT">0,000 s</span></div>
      <div class="fila"><span>Posición x (pista)</span><span id="vX">—</span></div>
      <div class="fila"><span>Recorrido en frenado</span><span id="vD">—</span></div>
      <div class="fila"><span>Velocidad v</span><span id="vV">—</span></div>
      <div class="fila"><span>Aceleración a</span><span id="vA">—</span></div>
      <div class="fila"><span>Fuerza resistente</span><span id="vF">—</span></div>
      <div class="sep"></div>
      <div class="fila"><span>θ · pendiente</span><span id="vTh">—</span></div>
      <div class="fila"><span>Masa · modelo</span><span id="vM">—</span></div>
    </div>
    <div class="hud" id="hudCam">
      <div class="tit">Cámara</div>
      <div class="grupo">
        <button data-cam="lateral">Lateral</button>
        <button data-cam="superior">Superior</button>
        <button data-cam="libre">Libre</button>
        <button data-cam="seguir">Seguir</button>
      </div>
      <div class="tit">Visualización</div>
      <div class="grupo">
        <button id="bFuerzas">Mostrar fuerzas</button>
        <button id="bEtiq" class="on">Etiquetas</button>
      </div>
    </div>
    <div class="hud" id="leyenda"></div>
    <div id="aviso"></div>
  </div>
  <div id="barra">
    <button id="bIniciar" class="prim" title="Iniciar desde t = 0">▶ Iniciar</button>
    <button id="bPausa" title="Pausar / Reanudar (barra espaciadora)">⏸ Pausar</button>
    <button id="bReiniciar" title="Volver a t = 0">⏮ Reiniciar</button>
    <button id="bOtra" title="Reiniciar y reproducir de nuevo">↻ Simular nuevamente</button>
    <input id="tiempo" type="range" min="0" max="1000" step="1" value="0" aria-label="Barra temporal">
    <span id="tlbl">0,000 / 0,000 s</span>
    <label for="vel" style="font-size:12px;color:#b9cde6">Velocidad</label>
    <select id="vel">
      <option value="0.1">0,1×</option>
      <option value="0.25">0,25×</option>
      <option value="0.5">0,5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
  </div>
  <div id="graficas">
    <div class="gwrap"><canvas id="gX"></canvas></div>
    <div class="gwrap"><canvas id="gV"></canvas></div>
    <div class="gwrap"><canvas id="gA"></canvas></div>
  </div>
</div>

<script>
/* Datos generados por fisica.py (Python es la fuente de verdad). */
window.DATOS = /*__DATOS__*/null;
</script>
<script type="module">
// ---------------------------------------------------------------------------
// Carga de Three.js: primero la copia local servida por Streamlit
// (static/vendor), luego CDN como respaldo.
// ---------------------------------------------------------------------------
async function cargarThree() {
  // 1) Copia local servida por Streamlit (static/vendor). La ruta se resuelve
  //    respecto a la página de la app, así funciona en localhost:8501 y en
  //    Streamlit Community Cloud (donde la app vive bajo /~/+/).
  // 2) Respaldo por CDN (jsDelivr, luego unpkg).
  const REL = 'app/static/vendor/three.module.min.js';
  const bases = [];
  try { bases.push(window.parent.location.href); } catch (e) {}
  try { bases.push(document.baseURI); } catch (e) {}
  try { bases.push(window.location.href); } catch (e) {}
  const locales = [];
  for (const b of bases) { try { const u = new URL(REL, b).href; if (u.startsWith('http') && !locales.includes(u)) locales.push(u); } catch (e) {} }
  locales.push('/' + REL);
  for (const u of locales) {
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 10000);
      const r = await fetch(u, {cache: 'force-cache', signal: ctl.signal}); clearTimeout(tm);
      if (!r.ok) continue;
      const txt = await r.text();
      if (!txt.includes('WebGLRenderer')) continue;
      const url = URL.createObjectURL(new Blob([txt], {type: 'text/javascript'}));
      const mod = await import(url);
      console.info('Three.js cargado desde', u);
      return mod;
    } catch (e) { /* probar siguiente */ }
  }
  const cdns = ['https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
                'https://unpkg.com/three@0.160.0/build/three.module.min.js'];
  for (const u of cdns) {
    try { const mod = await import(u); console.info('Three.js cargado desde', u); return mod; } catch (e) {}
  }
  throw new Error('Three.js no disponible');
}

const D = window.DATOS;
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 3) => (v === null || v === undefined || !isFinite(v)) ? '—' : Number(v).toFixed(d).replace('.', ',').replace(/^-/, '−');
const fmtS = (v, d = 3) => (v > 0 ? '+' : '') + fmt(v, d);

function almacen(tipo) { try { return window[tipo]; } catch (e) { return null; } }
function leer(k, def) { try { const s = almacen('localStorage'); const v = s && s.getItem('simfren_' + k); return v === null || v === undefined ? def : JSON.parse(v); } catch (e) { return def; } }
function guardar(k, v) { try { const s = almacen('localStorage'); s && s.setItem('simfren_' + k, JSON.stringify(v)); } catch (e) {} }
function leerS(k, def) { try { const s = almacen('sessionStorage'); const v = s && s.getItem('simfren_' + k); return v === null || v === undefined ? def : JSON.parse(v); } catch (e) { return def; } }
function guardarS(k, v) { try { const s = almacen('sessionStorage'); s && s.setItem('simfren_' + k, JSON.stringify(v)); } catch (e) {} }

if (!D) {
  $('carga').textContent = 'Sin datos de simulación.';
  throw new Error('sin datos');
}

let THREE;
try { THREE = await cargarThree(); }
catch (e) {
  $('carga').innerHTML = 'No se pudo cargar Three.js (ni local ni por CDN).<br>Revise la carpeta static/vendor.';
  throw e;
}

// ---------------------------------------------------------------------------
// Constantes geométricas (m)
// ---------------------------------------------------------------------------
const G = D.geo;
const L = G.L_total, ANCHO = G.ancho;
const ESP = 0.015;                 // espesor del tablero de la pista
const Y_TOP = ESP;                 // superficie en coordenadas locales de la pista
const BISAGRA_Y = 0.015 + 0.007;   // altura del eje de la bisagra sobre la mesa
const BISAGRA_X = 0.86;            // posición mundial de la bisagra (extremo bajo)
const LARGO_C = G.largo_carro;
const R_RUEDA = 0.022;
const U_SOPORTE = -L + 0.07;       // soporte a 7 cm del extremo alto
const TH = D.theta_deg * Math.PI / 180;
const tray = D.tray;
const N = tray.t.length;
const T_TOTAL = tray.t[N - 1];

// ---------------------------------------------------------------------------
// Renderizador, escena y luces
// ---------------------------------------------------------------------------
const lienzo = $('lienzo');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({canvas: lienzo, antialias: true, preserveDrawingBuffer: false});
} catch (e) {
  $('carga').textContent = 'Este navegador no soporta WebGL.';
  throw e;
}
$('carga').style.display = 'none';
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe6edf5);
scene.fog = new THREE.Fog(0xe6edf5, 4, 11);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 50);

scene.add(new THREE.HemisphereLight(0xf4f8ff, 0x8a7a66, 0.85));
const sol = new THREE.DirectionalLight(0xffffff, 2.1);
sol.position.set(-1.2, 3.2, 2.0);
sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048);
sol.shadow.camera.left = -1.6; sol.shadow.camera.right = 1.6;
sol.shadow.camera.top = 1.2; sol.shadow.camera.bottom = -1.2;
sol.shadow.camera.near = 0.5; sol.shadow.camera.far = 8;
sol.shadow.bias = -0.0004;
sol.shadow.radius = 4;
scene.add(sol);
const relleno = new THREE.DirectionalLight(0xcfe0ff, 0.55);
relleno.position.set(2, 1.5, -2);
scene.add(relleno);

// ---------------------------------------------------------------------------
// Texturas procedurales (sin archivos externos)
// ---------------------------------------------------------------------------
function texCanvas(w, h, dibujar, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); dibujar(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function ruido(g, w, h, n, alfa, oscuro = true) {
  for (let i = 0; i < n; i++) {
    const v = oscuro ? 0 : 255;
    g.fillStyle = `rgba(${v},${v},${v},${Math.random() * alfa})`;
    g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
}
const texMDF = texCanvas(1024, 256, (g, w, h) => {
  g.fillStyle = '#b98d62'; g.fillRect(0, 0, w, h);
  ruido(g, w, h, 26000, 0.10); ruido(g, w, h, 9000, 0.08, false);
  for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(110,72,40,${0.03 + Math.random() * 0.05})`; g.lineWidth = 1 + Math.random() * 2;
    const y = Math.random() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + 6, w * .6, y - 6, w, y + 3); g.stroke(); }
});
const texBase = texCanvas(1024, 256, (g, w, h) => {
  g.fillStyle = '#d2b48c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { g.strokeStyle = `rgba(140,98,57,${0.05 + Math.random() * 0.08})`; g.lineWidth = 1 + Math.random() * 2.5;
    const y = Math.random() * h; g.beginPath(); g.moveTo(0, y);
    g.bezierCurveTo(w * .25, y + 10 * Math.random(), w * .7, y - 10 * Math.random(), w, y + 4); g.stroke(); }
  ruido(g, w, h, 12000, 0.06);
});
const texListon = texCanvas(512, 64, (g, w, h) => {
  g.fillStyle = '#9b6b40'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 25; i++) { g.strokeStyle = `rgba(70,40,20,${0.08 + Math.random() * 0.1})`; g.lineWidth = 1 + Math.random() * 2;
    const y = Math.random() * h; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y + (Math.random() - .5) * 6); g.stroke(); }
});
const texFriccion = texCanvas(256, 256, (g, w, h) => {
  g.fillStyle = '#e0892f'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(150,70,10,.55)'; g.lineWidth = 10;
  for (let i = -h; i < w + h; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); }
  ruido(g, w, h, 9000, 0.25); ruido(g, w, h, 4000, 0.18, false);
}, 6, 1);
const texSeguridad = texCanvas(256, 256, (g, w, h) => {
  g.fillStyle = '#c7ced8'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(90,100,115,.35)'; g.lineWidth = 6;
  for (let i = -h; i < w + h; i += 40) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke(); }
}, 2, 2);
const texRosca = texCanvas(32, 256, (g, w, h) => {
  g.fillStyle = '#c9ced6'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(60,65,75,.5)'; for (let y = 0; y < h; y += 8) g.fillRect(0, y, w, 3);
}, 1, 6);
// Cinta métrica (marcas cada cm, números cada 10 cm)
const PXM = 2200;
const texCinta = texCanvas(Math.round(L * PXM), 64, (g, w, h) => {
  g.fillStyle = '#f3c623'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1b1b1b'; g.font = 'bold 26px Segoe UI, Arial'; g.textBaseline = 'bottom';
  for (let cm = 0; cm <= Math.round(L * 100); cm++) {
    const x = Math.round(cm / 100 * PXM);
    const largo = cm % 10 === 0 ? 34 : (cm % 5 === 0 ? 24 : 14);
    g.fillRect(Math.min(x, w - 3), 0, cm % 10 === 0 ? 3 : 2, largo);
    if (cm % 10 === 0 && cm > 0 && cm < L * 100) { g.textAlign = 'center'; g.fillText(String(cm), x, h - 2); }
  }
});
texCinta.wrapS = texCinta.wrapT = THREE.ClampToEdgeWrapping;
// Mapa alfa para flechas discontinuas (componentes del peso)
const texGuion = texCanvas(4, 32, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h * 0.6); });

// ---------------------------------------------------------------------------
// Materiales
// ---------------------------------------------------------------------------
const M = {
  mdf: new THREE.MeshStandardMaterial({map: texMDF, roughness: 0.85}),
  base: new THREE.MeshStandardMaterial({map: texBase, roughness: 0.8}),
  liston: new THREE.MeshStandardMaterial({map: texListon, roughness: 0.75}),
  metal: new THREE.MeshStandardMaterial({color: 0xb8bfc8, metalness: 0.85, roughness: 0.32}),
  rosca: new THREE.MeshStandardMaterial({map: texRosca, metalness: 0.8, roughness: 0.35}),
  caucho: new THREE.MeshStandardMaterial({color: 0x1d1f22, roughness: 0.92}),
  espuma: new THREE.MeshStandardMaterial({color: 0x2b3442, roughness: 0.95}),
  friccion: new THREE.MeshStandardMaterial({map: texFriccion, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2}),
  seguridad: new THREE.MeshStandardMaterial({map: texSeguridad, roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -2}),
  cinta: new THREE.MeshStandardMaterial({map: texCinta, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2}),
  carro: new THREE.MeshPhysicalMaterial({color: 0x1d5fc4, metalness: 0.35, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.2}),
  vidrio: new THREE.MeshStandardMaterial({color: 0x182533, metalness: 0.6, roughness: 0.12}),
  rin: new THREE.MeshStandardMaterial({color: 0xd9dde3, metalness: 0.9, roughness: 0.25}),
  patin: new THREE.MeshStandardMaterial({color: 0x8a5a2b, roughness: 0.95, emissive: 0xff5a00, emissiveIntensity: 0}),
  lamina: new THREE.MeshStandardMaterial({color: 0x7d8794, metalness: 0.5, roughness: 0.45}),
  faro: new THREE.MeshStandardMaterial({color: 0xfff6d5, emissive: 0xfff2c0, emissiveIntensity: 0.4}),
  stop: new THREE.MeshStandardMaterial({color: 0x7a1010, emissive: 0xff1a1a, emissiveIntensity: 0.15}),
  mesa: new THREE.MeshStandardMaterial({color: 0xdfe4ea, roughness: 0.95}),
};
function caja(w, h, d, mat, sombra = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = sombra; m.receiveShadow = true; return m;
}

// ---------------------------------------------------------------------------
// Mesa, base y bisagra
// ---------------------------------------------------------------------------
const mesa = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), M.mesa);
mesa.rotation.x = -Math.PI / 2; mesa.receiveShadow = true; scene.add(mesa);
const rejilla = new THREE.GridHelper(8, 80, 0xb9c5d4, 0xcfd8e3);
rejilla.position.y = 0.0005; rejilla.material.transparent = true; rejilla.material.opacity = 0.55; scene.add(rejilla);

const BASE_LARGO = 2.0, BASE_X = BISAGRA_X - 0.9;
const base = caja(BASE_LARGO, 0.015, 0.40, M.base);
base.position.set(BASE_X - 0.02, 0.0075, 0); scene.add(base);

const bisagra = new THREE.Group();
for (const z of [-0.1, 0.1]) {
  const barril = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 20), M.metal);
  barril.rotation.x = Math.PI / 2; barril.position.set(BISAGRA_X, BISAGRA_Y, z); barril.castShadow = true;
  const hoja = caja(0.035, 0.002, 0.05, M.metal); hoja.position.set(BISAGRA_X + 0.015, 0.016, z);
  bisagra.add(barril, hoja);
}
scene.add(bisagra);

// ---------------------------------------------------------------------------
// Pista inclinable (grupo que gira alrededor de la bisagra)
// Coordenadas locales: u = x − L  (x medido desde el extremo alto, + descenso)
// ---------------------------------------------------------------------------
const pivote = new THREE.Group();

function flecha(color, discontinua = false, radio = 0.0035) {

  const eje = new THREE.Mesh(gCil, mat); eje.scale.set(radio, 1, radio);
  const punta = new THREE.Mesh(gCono, new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 0.45, transparent: true, depthTest: false, depthWrite: false}));
  eje.renderOrder = 20; punta.renderOrder = 21;
  punta.scale.set(radio * 3.2, 0.028, radio * 3.2);
  g.add(eje, punta); g.userData = {eje, punta, mat, discontinua};

}
const Y_UP = new THREE.Vector3(0, 1, 0);

}

function centroPista() { return enPista(L / 2, 0.02, 0); }
function presetCam(modo) {
  const c = centroPista();
  const ancho = lienzo.clientWidth || 800, alto = lienzo.clientHeight || 450;
  const asp = ancho / alto;
  // distancia para encuadrar un semiancho hw y una semialtura hh
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const ajuste = (hw, hh) => Math.max(hw / (tv * asp), hh / tv);
  if (modo === 'lateral') return {tgt: new THREE.Vector3(c.x, c.y + 0.06, 0), r: ajuste(1.08, 0.42), az: 0, el: 0.03};
  if (modo === 'superior') return {tgt: new THREE.Vector3(c.x, 0.05, -0.02), r: ajuste(1.08, 0.36), az: 0, el: Math.PI / 2 - 0.001};
  if (modo === 'seguir') return {tgt: posCarroMundo(), r: 0.75, az: 0.55, el: 0.42};
  return {tgt: c.clone().add(new THREE.Vector3(0.0, -0.05, 0)), r: ajuste(1.3, 0.62), az: 0.6, el: 0.46};
}
function aplicarOrbita() {
  const ce = Math.cos(orb.el);
  camera.position.set(orb.target.x + orb.r * ce * Math.sin(orb.az), orb.target.y + orb.r * Math.sin(orb.el), orb.target.z + orb.r * ce * Math.cos(orb.az));
  camera.lookAt(orb.target);
}
function irCam(modo, instantaneo = false) {

  document.querySelectorAll('[data-cam]').forEach(b => b.classList.toggle('on', b.dataset.cam === modo));
  const p = presetCam(modo);
  if (instantaneo) { orb.target.copy(p.tgt); orb.r = p.r; orb.az = p.az; orb.el = p.el; aplicarOrbita(); return; }
  camAnim = {t0: performance.now(), dur: 650, de: {tgt: orb.target.clone(), r: orb.r, az: orb.az, el: orb.el}, a: p};
}

function indice(t) {
  if (t <= tray.t[0]) return 0;
  if (t >= tray.t[N - 1]) return N - 1;
  let lo = 0, hi = N - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tray.t[m] <= t) lo = m; else hi = m; }
  return lo;
}
function estadoEn(t) {
  const i = indice(t);
  const dt = Math.max(0, t - tray.t[i]);
  const a = tray.a[i];
  let x = tray.x[i], v = tray.v[i];
  if (i < N - 1) {
    // Tramo de aceleración constante: x = xi + vi·dt + ½·a·dt² (sin extrapolar)
    x = Math.min(tray.x[i] + tray.v[i] * dt + 0.5 * a * dt * dt, tray.x[i + 1]);
    x = Math.max(x, tray.x[i]);
    v = Math.max(0, tray.v[i] + a * dt);
  }
  return {i, t, x, v, a, fase: tray.fase[i], F: tray.F[i]};
}

function posCarroMundo() { const p = new THREE.Vector3(carro.position.x, COM_LOCAL_Y + Y_TOP, 0); return pivote.localToWorld(p); }

function actualizarFuerzas(s, th) {

  dirNormal.set(Math.sin(th), Math.cos(th), 0);     // normal hacia afuera
  const f = D.fuerzas;
  const k = 0.22 / f.peso;                          // escala: mg ↦ 0,22 m
  const com = posCarroMundo();
  const contacto = pivote.localToWorld(new THREE.Vector3(carro.position.x - 0.02, Y_TOP + 0.006, 0));
  const tip = (o, d, l) => o.clone().addScaledVector(d.clone().normalize(), l + 0.012);
  ponerFlecha(F.peso, com, new THREE.Vector3(0, -1, 0), f.peso * k);
  F.peso.userData.tip = tip(com, new THREE.Vector3(0, -1, 0), f.peso * k);
  ponerFlecha(F.normal, com, dirNormal, f.normal * k);
  F.normal.userData.tip = tip(com, dirNormal, f.normal * k).add(new THREE.Vector3(0, 0.02, 0));
  ponerFlecha(F.par, com, dirBaja, f.par * k);
  F.par.userData.tip = tip(com, dirBaja, f.par * k).add(new THREE.Vector3(0.02, 0.02, 0));
  const dPerp = dirNormal.clone().negate();

  F.perp.userData.tip = tip(com, dPerp, f.perp * k).add(new THREE.Vector3(0.07, -0.01, 0));

  const Fr = s.F;

  ponerFlecha(F.freno, contacto, dirF, Fr * k);
  F.freno.userData.tip = tip(contacto, dirF, Fr * k).add(new THREE.Vector3(0, 0.01, 0));
  // Aceleración (cinemática, no es una fuerza): dibujada sobre el carrito
  const pA = com.clone().addScaledVector(dirNormal, 0.085);

  const dA = s.a >= 0 ? dirBaja.clone() : dirBaja.clone().negate();

  LF.acel.el.innerHTML = `a = ${fmt(s.a, 2)} m/s²`;

}

function bonito(min, max, n = 4) {

    x.fillStyle = col; x.font = '600 9.5px Segoe UI'; x.textAlign = 'left'; x.fillText(txt, Math.min(X(t) + 3, ml + pw - 56), mt + 9 + 11 * fila); };
